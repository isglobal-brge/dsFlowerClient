name: Native tree client predictor

on:
  push:
    paths:
      - ".github/workflows/native-tree-client.yml"
      - "inst/python/native_tree_predict_helper.py"
      - "inst/python/import_xgboost_model.py"
      - "inst/python/validate_model_artifact.py"
      - "inst/python/tests/test_native_tree_predict_helper.py"
      - "inst/python/tests/test_import_xgboost_model.py"
      - "inst/python/tests/test_validate_model_artifact.py"
      - "inst/flower_app/dsflower_runner/native_tree_*.py"
      - "inst/flower_app/dsflower_runner/boosting_*.py"
      - "inst/flower_app/dsflower_runner/*boost_artifact.py"
      - "inst/flower_app/dsflower_runner/lightgbm_artifact.py"
      - "inst/flower_app/dsflower_runner/forest_*.py"
      - "inst/flower_app/dsflower_runner/random_forest_adapter.py"
      - "inst/flower_app/dsflower_runner/association_*.py"
      - "inst/flower_app/dsflower_runner/epi_association.py"
      - "inst/flower_app/dsflower_runner/tree_release.py"
      - "inst/flower_app/dsflower_runner/release_guard.py"
      - "inst/flower_app/dsflower_runner/resampling.py"
      - "inst/flower_app/dsflower_runner/seeding.py"
      - "inst/flower_app/dsflower_runner/task.py"
      - "inst/flower_app/dsflower_runner/validation.py"
      - "inst/flower_app/dsflower_runner/vision.py"
      - "inst/flower_app/dsflower_runner/xgboost_*.py"
  pull_request:
    paths:
      - ".github/workflows/native-tree-client.yml"
      - "inst/python/native_tree_predict_helper.py"
      - "inst/python/import_xgboost_model.py"
      - "inst/python/validate_model_artifact.py"
      - "inst/python/tests/test_native_tree_predict_helper.py"
      - "inst/python/tests/test_import_xgboost_model.py"
      - "inst/python/tests/test_validate_model_artifact.py"
      - "inst/flower_app/dsflower_runner/native_tree_*.py"
      - "inst/flower_app/dsflower_runner/boosting_*.py"
      - "inst/flower_app/dsflower_runner/*boost_artifact.py"
      - "inst/flower_app/dsflower_runner/lightgbm_artifact.py"
      - "inst/flower_app/dsflower_runner/forest_*.py"
      - "inst/flower_app/dsflower_runner/random_forest_adapter.py"
      - "inst/flower_app/dsflower_runner/association_*.py"
      - "inst/flower_app/dsflower_runner/epi_association.py"
      - "inst/flower_app/dsflower_runner/tree_release.py"
      - "inst/flower_app/dsflower_runner/release_guard.py"
      - "inst/flower_app/dsflower_runner/resampling.py"
      - "inst/flower_app/dsflower_runner/seeding.py"
      - "inst/flower_app/dsflower_runner/task.py"
      - "inst/flower_app/dsflower_runner/validation.py"
      - "inst/flower_app/dsflower_runner/vision.py"
      - "inst/flower_app/dsflower_runner/xgboost_*.py"

permissions:
  contents: read

jobs:
  stdlib-predictor:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate isolated local prediction
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/native-tree-client-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            contract_python="$RUNNER_TEMP/native-tree-client-venv/Scripts/python.exe"
          else
            contract_python="$RUNNER_TEMP/native-tree-client-venv/bin/python"
          fi
          "$contract_python" -m pip install --disable-pip-version-check \
            flwr==1.31.0 \
            numpy==2.4.6 \
            pandas==3.0.3 \
            pyarrow==23.0.1 \
            cryptography==46.0.7
          "$contract_python" -m unittest -v \
            inst/python/tests/test_import_xgboost_model.py \
            inst/python/tests/test_native_tree_predict_helper.py \
            inst/python/tests/test_validate_model_artifact.py \
            inst/python/tests/test_boosting_adapter.py \
            inst/python/tests/test_boosting_artifacts.py
          "$contract_python" -I -c \
            'import sys; sys.path.insert(0, "inst/flower_app"); from dsflower_runner import association_runtime_probe as probe; from dsflower_runner import association_client_app as client_app; from dsflower_runner import association_server_app as server_app; from flwr.clientapp import ClientApp; from flwr.serverapp import ServerApp; assert isinstance(client_app.app, ClientApp) and isinstance(server_app.app, ServerApp) and probe.probe_association_runtime()'
          "$contract_python" -I -c \
            'import sys; sys.path.insert(0, "inst/flower_app"); from dsflower_runner import native_tree_client_app as client_app; from dsflower_runner import native_tree_server_app as server_app; from flwr.clientapp import ClientApp; from flwr.serverapp import ServerApp; assert isinstance(client_app.app, ClientApp) and isinstance(server_app.app, ServerApp)'
