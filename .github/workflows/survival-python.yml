name: Neural survival prediction and paired review

on:
  workflow_dispatch:
    inputs:
      server_revision:
        description: "Full dsFlower commit SHA for a coordinated runner review"
        required: true
        type: string
  push:
    paths:
      - ".github/workflows/survival-python.yml"
      - ".github/survival-python-requirements.txt"
      - "inst/flower_app/dsflower_runner/**"
      - "inst/python/predict_helper.py"
      - "inst/python/validate_model_spec.py"
      - "inst/python/tests/test_predict_helper.py"
      - "inst/python/tests/test_survival_predict_helper.py"
      - "R/survival.R"
      - "R/predict.R"
      - "R/model_codegen.R"
      - "R/app_submit.R"
      - "R/run.R"
      - "tools/check-runner-sync.py"
      - "tools/campaign/survival/**"
      - "tests/testthat/test-survival-evidence.R"
  pull_request:
    paths:
      - ".github/workflows/survival-python.yml"
      - ".github/survival-python-requirements.txt"
      - "inst/flower_app/dsflower_runner/**"
      - "inst/python/predict_helper.py"
      - "inst/python/validate_model_spec.py"
      - "inst/python/tests/test_predict_helper.py"
      - "inst/python/tests/test_survival_predict_helper.py"
      - "R/survival.R"
      - "R/predict.R"
      - "R/model_codegen.R"
      - "R/app_submit.R"
      - "R/run.R"
      - "tools/check-runner-sync.py"
      - "tools/campaign/survival/**"
      - "tests/testthat/test-survival-evidence.R"

permissions:
  contents: read

jobs:
  test:
    name: Public artifact prediction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout current dsFlowerClient revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: dsFlowerClient
          persist-credentials: false
      - name: Require an exact server revision for paired review
        if: github.event_name == 'workflow_dispatch'
        env:
          SERVER_REVISION: ${{ inputs.server_revision }}
        run: |
          if [[ ! "$SERVER_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "server_revision must be one full lowercase commit SHA" >&2
            exit 1
          fi
      - name: Checkout the declared canonical server revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: isglobal-brge/dsFlower
          ref: ${{ inputs.server_revision }}
          path: dsFlower
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Verify the exact paired runner trees
        if: github.event_name == 'workflow_dispatch'
        run: |
          git -C dsFlowerClient rev-parse HEAD
          git -C dsFlower rev-parse HEAD
          python dsFlowerClient/tools/check-runner-sync.py --server dsFlower
      - name: Install pinned CPU survival profile
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check -r dsFlowerClient/.github/survival-python-requirements.txt
          python -m pip check
      - name: Record revision and runtime
        run: |
          git -C dsFlowerClient rev-parse HEAD
          python -m pip freeze
          python -c 'import torch; assert not torch.cuda.is_available(), "CI requires CPU execution"'
      - name: Run neural prediction regression and survival artifact tests
        working-directory: dsFlowerClient
        run: |
          python -m unittest -v inst/python/tests/test_predict_helper.py inst/python/tests/test_survival_predict_helper.py
      - name: Run canonical survival gates on the paired server revision
        if: github.event_name == 'workflow_dispatch'
        working-directory: dsFlower
        run: python -m unittest -v inst/python/tests/test_survival_contracts.py
      - name: Run public scoring and campaign completion gate tests
        working-directory: dsFlowerClient/tools/campaign/survival
        run: python -m unittest -v test_metrics.py test_validate_completion.py
