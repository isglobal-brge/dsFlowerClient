name: Runner sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-sync.yml"
      - "tools/check-runner-sync.py"
      - "inst/flower_app/dsflower_runner/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/runner-sync.yml"
      - "tools/check-runner-sync.py"
      - "inst/flower_app/dsflower_runner/**"

permissions:
  contents: read

jobs:
  compare:
    name: Canonical runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dsFlowerClient
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: dsFlowerClient
          persist-credentials: false
      - name: Checkout canonical dsFlower
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: isglobal-brge/dsFlower
          ref: main
          path: dsFlower
          persist-credentials: false
      - name: Verify byte-identical runners
        run: python3 dsFlowerClient/tools/check-runner-sync.py --server dsFlower
