name: Real two-node Flower smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    name: Linux, 2 DSLite nodes, 1 Flower round
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSFLOWER_SKIP_PYTHON_SETUP: "1"
      DSFLOWER_TEST_ALLOW_EPHEMERAL_SECRET: "1"

    steps:
      - name: Check out dsFlowerClient
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out dsFlower server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: isglobal-brge/dsFlower
          path: dsFlower-server

      - name: Set up R
        uses: r-lib/actions/setup-r@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 # v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Configure private temporary paths
        shell: bash
        run: |
          echo "DSFLOWER_VENV_ROOT=$RUNNER_TEMP/dsflower-venvs" >> "$GITHUB_ENV"
          echo "DSFLOWER_CLIENT_VENV_ROOT=$RUNNER_TEMP/dsflower-client" >> "$GITHUB_ENV"
          echo "DSFLOWER_SMOKE_WORKDIR=$RUNNER_TEMP/dsflower-smoke" >> "$GITHUB_ENV"
          echo "DSFLOWER_NODE_SECRET_FILE=$RUNNER_TEMP/dsflower-smoke/parent-node-secret" >> "$GITHUB_ENV"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 # v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::DSLite
            any::dsBase
            any::arrow
            any::filelock
          cache: true

      - name: Provision the CPU Flower runtime
        shell: bash
        run: |
          python3 -m venv "$DSFLOWER_VENV_ROOT/pytorch"
          server_python="$DSFLOWER_VENV_ROOT/pytorch/bin/python"
          "$server_python" -m pip install --disable-pip-version-check --upgrade pip
          "$server_python" -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.10.0' \
            'torchvision==0.25.0'
          "$server_python" -m pip install --disable-pip-version-check \
            'flwr==1.31.0' \
            'numpy==2.4.6' \
            'pandas==3.0.3' \
            'pyarrow==23.0.1' \
            'cryptography==46.0.7' \
            'opacus==1.6.0' \
            'Pillow==12.3.0' \
            'nibabel==5.4.2' \
            'pydicom==3.0.2' \
            'pynrrd==1.1.3' \
            'SimpleITK==2.5.6' \
            'monai==1.6.0'
          python3 -m venv "$DSFLOWER_CLIENT_VENV_ROOT/venv"
          client_python="$DSFLOWER_CLIENT_VENV_ROOT/venv/bin/python"
          "$client_python" -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.10.0'
          "$client_python" -m pip install --disable-pip-version-check \
            'flwr==1.31.0' \
            'optuna==4.8.0' \
            'numpy==2.4.6' \
            'pandas==3.0.3' \
            'pyarrow==23.0.1' \
            'cryptography==46.0.7' \
            'opacus==1.6.0'

      - name: Install current R sources
        shell: bash
        run: |
          R CMD INSTALL dsFlower-server
          R CMD INSTALL .
          Rscript - <<'RS'
          server_venv <- file.path(Sys.getenv("DSFLOWER_VENV_ROOT"), "pytorch")
          writeLines(dsFlower:::.python_env_spec_hash("pytorch"),
                     file.path(server_venv, ".dsflower_ready"))
          stopifnot(dsFlower:::.record_venv_versions(server_venv))
          client_venv <- file.path(
            Sys.getenv("DSFLOWER_CLIENT_VENV_ROOT"), "venv")
          writeLines(dsFlowerClient:::.client_venv_marker(),
                     file.path(client_venv, ".dsflower_client_ready"))
          stopifnot(
            dsFlower:::.venv_is_healthy(server_venv, "pytorch"),
            dsFlowerClient:::.client_venv_is_healthy()
          )
          RS

      - name: Record exact revisions and versions
        shell: bash
        run: |
          echo "dsFlowerClient SHA: $(git rev-parse HEAD)"
          echo "dsFlower SHA: $(git -C dsFlower-server rev-parse HEAD)"
          Rscript -e 'cat("R:", R.version.string, "\n"); cat("dsFlower:", as.character(packageVersion("dsFlower")), "\n"); cat("dsFlowerClient:", as.character(packageVersion("dsFlowerClient")), "\n")'
          "$DSFLOWER_VENV_ROOT/pytorch/bin/python" - <<'PY'
          import cryptography, flwr, monai, nibabel, nrrd, numpy, opacus
          import pandas, PIL, pydicom, pyarrow, SimpleITK, torch, torchvision
          assert not torch.cuda.is_available(), "CPU-only smoke saw a CUDA runtime"
          print(f"Python runtime: Flower {flwr.__version__}, "
                f"PyTorch {torch.__version__}, Opacus {opacus.__version__}")
          print(f"Data runtime: NumPy {numpy.__version__}, Pandas {pandas.__version__}, "
                f"PyArrow {pyarrow.__version__}, cryptography {cryptography.__version__}")
          PY

      - name: Run real two-node smoke
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/dsflower-smoke/tmp
        run: |
          mkdir -p "$TMPDIR" "$DSFLOWER_SMOKE_WORKDIR"
          setsid timeout --signal=TERM --kill-after=20s 280s \
            Rscript tools/integration/dslite-multinode-smoke.R &
          smoke_pgid=$!
          echo "$smoke_pgid" > "$DSFLOWER_SMOKE_WORKDIR/process-group"
          wait "$smoke_pgid"

      - name: Reap smoke processes
        if: always()
        shell: bash
        run: |
          wait_for_exit=false
          pgid_file="$DSFLOWER_SMOKE_WORKDIR/process-group"
          if [ -f "$pgid_file" ]; then
            smoke_pgid="$(head -n 1 "$pgid_file")"
            if [[ "$smoke_pgid" =~ ^[0-9]+$ ]] && \
               kill -0 -- "-$smoke_pgid" 2>/dev/null; then
              kill -TERM -- "-$smoke_pgid" 2>/dev/null || true
              wait_for_exit=true
            fi
          fi
          if pgrep -f 'flower-super(link|node|exec)' >/dev/null; then
            pkill -TERM -f 'flower-super(link|node|exec)' || true
            wait_for_exit=true
          fi
          if [ "$wait_for_exit" = true ]; then
            sleep 15
            if [[ "${smoke_pgid:-}" =~ ^[0-9]+$ ]]; then
              kill -KILL -- "-$smoke_pgid" 2>/dev/null || true
            fi
            pkill -KILL -f 'flower-super(link|node|exec)' || true
          fi

      - name: Upload synthetic model evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsflower-two-node-smoke
          path: ${{ runner.temp }}/dsflower-smoke/artifact/
          if-no-files-found: error
          retention-days: 7
