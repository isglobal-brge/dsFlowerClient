url: https://isglobal-brge.github.io/dsFlowerClient/

template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    in_header: ""
footer:
  structure:
    left: package
    right: built_with

navbar:
  structure:
    left:  [intro, articles, reference]
    right: [search, github]
  components:
    articles:
      text: Guides
      menu:
        - text: "API Quickstart"
          href: articles/api-quickstart.html
        - text: "Validation Evidence Overview"
          href: articles/demo-overview.html
        - text: "Clinical Privacy Benchmarks"
          href: articles/clinical-privacy-benchmarks.html
        - text: "Clinical Method-Family Benchmarks"
          href: articles/clinical-method-family-benchmarks.html
        - text: "PathMNIST Direct Image ResNet Benchmark"
          href: articles/pathmnist-direct-image-resnet.html
        - text: "LUNG1 Direct dsImaging ResNet Evidence"
          href: articles/lung1-direct-image-dsimaging-resnet.html
        - text: "LUNG1 dsImaging Radiomics Evidence"
          href: articles/lung1-radiomics-to-flower.html
        - text: "Method Validation Overview"
          href: articles/validation-overview.html
        - text: "Vision Validation Overview"
          href: articles/validation-vision-overview.html
        - text: "Development Smoke Demos"
          href: articles/direct-image-resnet.html

articles:
  - title: Current validation evidence
    navbar: ~
    contents:
      - api-quickstart
      - demo-overview
      - pathmnist-direct-image-resnet
      - lung1-direct-image-dsimaging-resnet
      - lung1-radiomics-to-flower
      - clinical-privacy-benchmarks
      - clinical-method-family-benchmarks
  - title: Development and smoke demos
    desc: "Small self-contained demos retained for installation and connectivity checks."
    contents:
      - demo-breast-cancer
      - demo-heart-disease
      - demo-medmnist
      - direct-image-resnet
      - demo-lung1-radiomics
      - radiomics-to-flower
  - title: Method validation
    desc: "Synthetic catalogue coverage against centralized baselines."
    contents:
      - validation-sklearn-logreg
      - validation-sklearn-ridge
      - validation-sklearn-sgd
      - validation-sklearn-svm
      - validation-sklearn-elastic-net
      - validation-pytorch-logreg
      - validation-pytorch-mlp
      - validation-pytorch-linear-regression
      - validation-pytorch-multiclass
      - validation-pytorch-multilabel
      - validation-pytorch-poisson
      - validation-pytorch-coxph
      - validation-pytorch-lognormal-aft
      - validation-pytorch-cause-specific-cox
      - validation-pytorch-lstm
      - validation-pytorch-tcn
      - validation-xgboost
      - validation-overview
  - title: Vision method validation
    desc: "Image and segmentation templates validated against centralized PyTorch baselines."
    contents:
      - validation-vision-pytorch-resnet18
      - validation-vision-pytorch-densenet121
      - validation-vision-pytorch-unet2d
      - validation-vision-overview

reference:
  - title: "Lifecycle: Node Management"
    desc: "Connect, prepare, and manage federated nodes on Opal servers."
    contents:
      - ds.flower.nodes.init
      - ds.flower.nodes.prepare
      - ds.flower.nodes.ensure
      - ds.flower.nodes.cleanup

  - title: "Lifecycle: SuperLink"
    desc: "Start, monitor, and stop the local Flower SuperLink process."
    contents:
      - ds.flower.superlink.start
      - ds.flower.superlink.status
      - ds.flower.superlink.stop

  - title: "Lifecycle: Training Runs"
    desc: "Launch and manage federated training runs."
    contents:
      - ds.flower.run.start
      - ds.flower.run.stop
      - ds.flower.run.list
      - ds.flower.run.logs

  - title: "Specification: Models"
    desc: "Model specification objects for federated learning."
    contents:
      - ds.flower.model.sklearn_logreg
      - ds.flower.model.sklearn_ridge
      - ds.flower.model.sklearn_sgd
      - ds.flower.model.pytorch_mlp
      - ds.flower.model.pytorch_resnet18
      - ds.flower.model.pytorch_densenet121
      - ds.flower.model.pytorch_unet2d

  - title: "Specification: Strategies"
    desc: "Federated aggregation strategy specifications."
    contents:
      - ds.flower.strategy.fedavg
      - ds.flower.strategy.fedprox

  - title: "Specification: Tasks & Privacy"
    desc: "Task types and privacy enhancement specifications."
    contents:
      - ds.flower.task.classification
      - ds.flower.task.regression
      - ds.flower.task.segmentation
      - ds.flower.task.survival
      - ds.flower.privacy.sandbox_open
      - ds.flower.privacy.trusted_internal
      - ds.flower.privacy.consortium_internal
      - ds.flower.privacy.clinical_default
      - ds.flower.privacy.clinical_hardened
      - ds.flower.privacy.clinical_update_noise
      - ds.flower.privacy.high_sensitivity_dp
      - ds.flower.privacy.evaluation_only
      - ds.flower.privacy.budget

  - title: "Specification: Recipe"
    desc: "Combine task, model, strategy, and privacy into a recipe."
    contents:
      - ds.flower.recipe

  - title: "Results & Metrics"
    desc: "Collect, compare, and visualize training results."
    contents:
      - ds.flower.metrics
      - ds.flower.compare
      - ds.flower.plot
      - ds.flower.log
      - dsflower_result
      - ds.flower.code
      - ds.flower.copy_code

  - title: "Print Methods"
    contents:
      - print.dsflower_model
      - print.dsflower_strategy
      - print.dsflower_task
      - print.dsflower_privacy
      - print.dsflower_recipe
      - print.dsflower_result
      - as.data.frame.dsflower_result
      - "`$.dsflower_result`"

  - title: "Full Exported API"
    desc: "Catch-all index for exported helpers not listed above."
    contents:
      - starts_with("ds.flower.")
      - starts_with("print.")
