url: https://isglobal-brge.github.io/dsFlowerClient/

template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    in_header: ""
footer:
  structure:
    left: package
    right: built_with

navbar:
  structure:
    left:  [intro, articles, reference]
    right: [search, github]
  components:
    articles:
      text: Guides
      menu:
        - text: "API Quickstart"
          href: articles/api-quickstart.html
        - text: "Server Method Registration"
          href: articles/method-registration-live-federation.html

articles:
  - title: Current guides
    navbar: ~
    contents:
      - api-quickstart
      - method-registration-live-federation
  - title: Historical pre-0.3 validation records
    navbar: ~
    contents:
      - clinical-method-family-benchmarks
      - clinical-privacy-benchmarks
      - demo-overview
      - lung1-direct-image-dsimaging-resnet
      - lung1-radiomics-to-flower
      - pathmnist-direct-image-resnet
      - starts_with("validation-")

reference:
  - title: "High-level submission"
    desc: "Declarative DP training and the separately gated HookApp contract."
    contents:
      - ds.flower.fit
      - ds.flower.submit
      - ds.flower.hook.run
      - ds.flower.app.upload

  - title: "Lifecycle: Node Management"
    desc: "Connect, prepare, and manage federated nodes on Opal servers."
    contents:
      - ds.flower.nodes.init
      - ds.flower.nodes.prepare
      - ds.flower.nodes.ensure
      - ds.flower.nodes.cleanup

  - title: "Lifecycle: SuperLink"
    desc: "Start, monitor, and stop the local Flower SuperLink process."
    contents:
      - ds.flower.superlink.start
      - ds.flower.superlink.status
      - ds.flower.superlink.stop

  - title: "Lifecycle: Training Runs"
    desc: "Launch and manage federated training runs."
    contents:
      - ds.flower.run.start
      - ds.flower.run.stop
      - ds.flower.run.list
      - ds.flower.run.logs

  - title: "Specification: Models"
    desc: "Model specification objects for federated learning."
    contents:
      - ds.flower.model
      - ds.flower.model.pytorch_linear_regression
      - ds.flower.model.pytorch_logreg
      - ds.flower.model.pytorch_lstm
      - ds.flower.model.pytorch_mlp
      - ds.flower.model.pytorch_multiclass
      - ds.flower.model.pytorch_multilabel
      - ds.flower.model.pytorch_poisson
      - ds.flower.model.pytorch_tcn
      - ds.flower.model.xgboost

  - title: "Specification: Strategies"
    desc: "Federated aggregation strategy specifications."
    contents:
      - ds.flower.strategy.fedavg
      - ds.flower.strategy.fedprox

  - title: "Specification: Tasks"
    desc: "Task types. Differential privacy policy is node-owned, not a client specification."
    contents:
      - ds.flower.task.classification
      - ds.flower.task.regression
      - ds.flower.task.segmentation
      - ds.flower.task.survival

  - title: "Specification: Recipe"
    desc: "Combine task, model, and strategy into a recipe; privacy remains node-owned."
    contents:
      - ds.flower.recipe

  - title: "Results & Compatibility Diagnostics"
    desc: "Work with model results. Hardened nodes return empty node metrics and logs."
    contents:
      - ds.flower.metrics
      - ds.flower.compare
      - ds.flower.plot
      - ds.flower.log
      - dsflower_result
      - ds.flower.code
      - ds.flower.copy_code

  - title: "Print Methods"
    contents:
      - print.dsflower_model
      - print.dsflower_strategy
      - print.dsflower_task
      - print.dsflower_recipe
      - print.dsflower_result
      - as.data.frame.dsflower_result
      - "`$.dsflower_result`"

  - title: "Full Exported API"
    desc: "Catch-all index for exported helpers not listed above."
    contents:
      - starts_with("ds.flower.")
      - starts_with("print.")
